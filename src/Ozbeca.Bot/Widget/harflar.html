<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:5 12 14;--fg:255 255 255;--ink:242 246 247;--i3:168 172 172;--ac:0 180 204;--ac2:0 114 138;--good:119 208 162;--e:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:rgb(var(--ink));padding:16px;
background:radial-gradient(120% 70% at 0 0,rgb(var(--ac)/.16),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgb(var(--ac2)/.22),transparent 60%),rgb(var(--bg))}
.lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--i3))}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:2px 0 14px}
.cd{background:rgb(var(--fg)/.035);border:1px solid rgb(var(--fg)/.08);border-radius:20px;box-shadow:inset 0 1px 0 rgb(var(--fg)/.05)}
#st{position:relative;height:168px;overflow:hidden;display:grid;place-items:center}
#st:before{content:"";position:absolute;inset:auto 0 -40% 0;height:80%;background:radial-gradient(50% 60% at 50% 100%,rgb(var(--ac)/.28),transparent 70%)}
.g{position:absolute;font-size:96px;font-weight:700;letter-spacing:-.04em;line-height:1;transition:opacity .9s var(--e),transform .9s var(--e)}
.o{display:flex}.o i{font-style:normal;position:absolute;left:100%;color:rgb(var(--i3));transition:inherit}
.n{opacity:0;background:linear-gradient(180deg,#5ee6f5,rgb(var(--ac)) 60%,rgb(var(--ac2)));-webkit-background-clip:text;color:transparent}
#wr{position:relative;display:grid;place-items:center;margin-top:-22px;transform:translateX(var(--x,-.16em));font-size:96px;transition:transform 1s var(--e)}#wr .g{font-size:1em}
#st.m #wr{transform:none}#st.m .o b{opacity:0;transition-delay:.55s}#st.m .n{opacity:1}
#st.m .o i{opacity:0;transform:var(--t)}
#cp{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:rgb(var(--i3))}
#cp b{color:rgb(var(--ink));font-weight:600}
#gr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
#gr button{all:unset;cursor:pointer;text-align:center;padding:12px 0 9px;border-radius:16px;background:rgb(var(--fg)/.035);border:1px solid rgb(var(--fg)/.08);transition:transform .15s var(--e),border-color .2s,background .2s}
#gr button:active{transform:scale(.95)}#gr button.on{border-color:rgb(var(--ac)/.6);background:rgb(var(--ac)/.12)}
#gr b{display:block;font-size:28px;font-weight:650;line-height:1.1}#gr s{text-decoration:none;font-size:11px;color:rgb(var(--i3));font-family:ui-monospace,Consolas,monospace}
#ms{height:20px;margin-top:10px;text-align:center;font-size:13px;color:rgb(var(--good));opacity:0;transition:opacity .4s var(--e)}#ms.v{opacity:1}
@media(prefers-reduced-motion:reduce){.g,.o i{transition:none}}
</style></head><body>
<div class="lb">Yangi alifbo · 2026</div><h1>Harflar</h1>
<div id="st" class="cd"><div id="wr"><div class="g o"><b id="ob"></b><i id="ot"></i></div><div class="g n" id="nw"></div></div><div id="cp"></div></div>
<div id="gr"></div><div id="ms"></div>
<script>
var W=window.TelegramWidget,
P=[["S","h","Ş","Şahar","Shahar","translate(-.55em,.32em) scale(.3)"],["C","h","Ç","Çoy","Choy","translate(-.55em,.32em) scale(.3)"],
["O","ʻ","Ö","Özbek","Oʻzbek","translate(-.62em,-.5em) scale(.6)"],["G","ʻ","Ğ","Ğişt","Gʻisht","translate(-.62em,-.55em) scale(.6)"],
["","ʼ","ʼ","Maʼno","Ma'no","none"]],k=0,tm,st=document.getElementById("st");
function $(i){return document.getElementById(i)}
function show(i){var p=P[i];k=i;st.className="cd";st.style.setProperty("--t",p[5]);st.style.setProperty("--x",p[0]&&p[1]!="ʻ"?"-.26em":"-.1em");
$("ob").textContent=p[0]||"ʼ";$("ot").textContent=p[0]?p[1]:"";$("nw").textContent=p[2];
$("cp").innerHTML="";var o=document.createElement("span");o.textContent=p[4]+"  →  ";var n=document.createElement("b");n.textContent=p[3];$("cp").append(o,n);
[].forEach.call($("gr").children,function(b,j){b.className=j==i?"on":""});
setTimeout(function(){st.className="cd m"},1100)}
function loop(){clearTimeout(tm);tm=setTimeout(function(){show((k+1)%P.length);loop()},3600)}
P.forEach(function(p,i){var b=document.createElement("button"),g=document.createElement("b"),s=document.createElement("s");
g.textContent=p[2];s.textContent=p[0]?(p[0]+p[1]).toLowerCase().replace("ʻ","'"):"'";b.append(g,s);
b.onclick=function(){show(i);loop();try{W.copyText(p[2]);W.HapticFeedback.impactOccurred("light")}catch(e){}
var m=$("ms");m.textContent="Nusxa olindi: "+p[2];m.className="v";setTimeout(function(){m.className=""},1600)};$("gr").appendChild(b)});
show(0);loop();if(W&&W.ready)W.ready();
</script></body></html>
