<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:5 12 14;--fg:255 255 255;--ink:242 246 247;--i3:168 172 172;--ac:0 180 204;--ac2:0 114 138;--warn:235 189 87;--e:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:rgb(var(--ink));padding:16px;
background:radial-gradient(120% 70% at 0 0,rgb(var(--ac)/.16),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgb(var(--ac2)/.22),transparent 60%),rgb(var(--bg))}
.lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--i3))}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:2px 0 14px}
.cd{padding:16px;border-radius:20px;background:rgb(var(--fg)/.035);border:1px solid rgb(var(--fg)/.08);box-shadow:inset 0 1px 0 rgb(var(--fg)/.05)}
.n{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.045em}
#t{font-size:44px;line-height:1.05;margin-top:4px}#t small{font-size:15px;letter-spacing:0;color:rgb(var(--i3));font-weight:500;margin-left:6px}
#ch{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin-top:16px}
#ch i{display:block;height:100%;border-radius:6px 6px 3px 3px;background:rgb(var(--ac)/.32);transform-origin:bottom;transform:scaleY(0);transition:transform 1.3s var(--e)}
#ch i.td{background:linear-gradient(180deg,#5ee6f5,rgb(var(--ac)) 55%,rgb(var(--ac2)));box-shadow:0 0 18px rgb(var(--ac)/.35)}
#dy{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;font-size:11px;color:rgb(var(--i3));text-align:center}
#dy .td{color:rgb(var(--ac));font-weight:600}
#gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
#gr .cd{padding:13px 14px}#gr .n{display:block;font-size:24px;margin-top:2px}
#gr small{font-size:12px;color:rgb(var(--i3))}
</style></head><body>
<div class="lb">Faqat siz körasiz</div><h1>Mening statistikam</h1>
<div class="cd"><small class="lb">Bugun ögirildi</small><div id="t" class="n"><span id="tn">0</span><small>belgi</small></div>
<div id="ch"></div><div id="dy"></div></div>
<div id="gr"><div class="cd"><small>Jami belgi</small><span class="n" id="a">0</span></div>
<div class="cd"><small>Fayllar</small><span class="n" id="f">0</span></div>
<div class="cd"><small>Faol kunlar (7)</small><span class="n" id="k">0</span></div>
<div class="cd"><small>Öyin rekordi</small><span class="n" id="b" style="color:rgb(var(--warn))">0</span></div></div>
<script>
var W=window.TelegramWidget,D=W?{t:0,w:[0,0,0,0,0,0,0],a:0,f:0,b:0}:{t:1840,w:[320,0,910,1200,450,2600,1840],a:48210,f:6,b:7},S=D,
N=["Ya","Du","Se","Çor","Pay","Jum","Şan"];
function $(i){return document.getElementById(i)}
function fm(v){return Math.round(v).toLocaleString("ru-RU").replace(/,/g," ")}
function count(e,v){var f=+e.dataset.v||0,t0=performance.now(),d=f?700:1300;e.dataset.v=v;
(function st(n){var p=Math.min(1,(n-t0)/d);p=1-Math.pow(1-p,3);e.textContent=fm(f+(v-f)*p);if(p<1)requestAnimationFrame(st)})(t0)}
function draw(){S=D;try{var j=W&&W.chatData&&JSON.parse(W.chatData);if(j)S=Object.assign({},D,j)}catch(e){}
var w=S.w||[],m=Math.max.apply(0,w.concat(1)),ch=$("ch"),dy=$("dy"),d=new Date().getDay();
if(!ch.children.length)for(var i=0;i<7;i++){ch.appendChild(document.createElement("i"));dy.appendChild(document.createElement("span"))}
w.forEach(function(v,i){var b=ch.children[i],l=dy.children[i];b.className=l.className=i==6?"td":"";
l.textContent=N[(d+i+1)%7];setTimeout(function(){b.style.transform="scaleY("+Math.max(.04,v/m)+")"},60+i*70)});
count($("tn"),S.t);count($("a"),S.a);count($("f"),S.f);count($("b"),S.b);
$("k").textContent=w.filter(function(v){return v>0}).length+" / 7"}
draw();if(W){W.onEvent("chatDataChanged",draw);W.onEvent("activated",function(){W.request("r:t")});W.ready&&W.ready()}
</script></body></html>
