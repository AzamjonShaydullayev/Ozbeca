<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:5 12 14;--fg:255 255 255;--ink:242 246 247;--i3:168 172 172;--ac:0 180 204;--ac2:0 114 138;--e:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:rgb(var(--ink));padding:16px;
background:radial-gradient(120% 70% at 0 0,rgb(var(--ac)/.16),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgb(var(--ac2)/.22),transparent 60%),rgb(var(--bg))}
.lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--i3))}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:2px 0 14px}
button{all:unset;cursor:pointer;box-sizing:border-box;transition:transform .15s var(--e),border-color .25s,background .25s}
button:active{transform:scale(.97)}
#dr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d{padding:14px;border-radius:20px;background:rgb(var(--fg)/.035);border:1px solid rgb(var(--fg)/.08);box-shadow:inset 0 1px 0 rgb(var(--fg)/.05);position:relative}
.d small{display:block;font-size:12px;color:rgb(var(--i3));margin-bottom:8px}
.d b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
.d em{display:block;font-style:normal;color:rgb(var(--ac));font-size:20px}.d s{display:block;text-decoration:none;font-size:13px;font-weight:500;color:rgb(var(--i3))}.d s:after{content:" ↓";color:rgb(var(--ac)/.7)}
.d:after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;border:1.5px solid rgb(var(--fg)/.25);transition:all .3s var(--e)}
.d.on{border-color:rgb(var(--ac)/.55);background:rgb(var(--ac)/.12)}
.d.on:after{background:rgb(var(--ac));border-color:rgb(var(--ac));box-shadow:0 0 10px rgb(var(--ac)/.8)}
#tg{margin-top:12px;border-radius:20px;background:rgb(var(--fg)/.035);border:1px solid rgb(var(--fg)/.08);overflow:hidden}
.t{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px}
.t+.t{border-top:1px solid rgb(var(--fg)/.06)}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgb(var(--ac)/.12);color:rgb(var(--ac))}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:600;font-size:15px}.tx small{display:block;font-size:12px;color:rgb(var(--i3))}
.sw{flex:none;width:44px;height:26px;border-radius:99px;background:rgb(var(--fg)/.14);position:relative;transition:background .35s var(--e)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.4);transition:transform .45s var(--e)}
.t.on .sw{background:linear-gradient(90deg,rgb(var(--ac2)),rgb(var(--ac)))}.t.on .sw:after{transform:translateX(18px)}
#ms{height:18px;margin-top:10px;text-align:center;font-size:12px;color:rgb(var(--i3))}
.busy button{opacity:.6;pointer-events:none}
</style></head><body>
<div class="lb">Özbeça</div><h1>Sozlama</h1>
<div id="dr"><button class="d" id="d0"><small>Eski → Yangi</small><b><s>Shahar</s><em>Şahar</em></b></button>
<button class="d" id="d1"><small>Yangi → Eski</small><b><s>Şahar</s><em>Shahar</em></b></button></div>
<div id="tg">
<button class="t" id="tc"><span class="ic">Ш</span><span class="tx"><b>Kirillni ham ögiriş</b><small>Шаҳар → Şahar</small></span><span class="sw"></span></button>
<button class="t" id="tw"><span class="ic">ʼ</span><span class="tx"><b>Tutuqsiz sözlar</b><small>ozbek → özbek</small></span><span class="sw"></span></button>
<button class="t" id="tf"><span class="ic">TXT</span><span class="tx"><b>Uzun matn — fayl</b><small>4000 belgidan uzun bölsa .txt</small></span><span class="sw"></span></button>
</div><div id="ms"></div>
<script>
var W=window.TelegramWidget,D={d:0,c:1,w:1,f:0},S=D,busy=0;
function $(i){return document.getElementById(i)}
function draw(){S=D;try{var j=W&&W.chatData&&JSON.parse(W.chatData);if(j)S=Object.assign({},D,j)}catch(e){}
$("d0").className="d"+(S.d?"":" on");$("d1").className="d"+(S.d?" on":"");
["c","w","f"].forEach(function(k){$("t"+k).className="t"+(S[k]?" on":"")})}
function ask(r){$("ms").textContent="";if(!W){var k=r.split(":");if(k[0]=="d")D.d=+k[1];else D[k[1]]=D[k[1]]?0:1;return draw()}
if(busy)return;busy=1;document.body.className="busy";
W.request(r).then(function(a){done();if(!a||a.result!="ok")$("ms").textContent="Xatolik. Qayta bosing.";else try{W.HapticFeedback.selectionChanged()}catch(e){}},
function(){done();$("ms").textContent="Xatolik. Qayta bosing."})}
function done(){busy=0;document.body.className=""}
$("d0").onclick=function(){ask("d:0")};$("d1").onclick=function(){ask("d:1")};
["c","w","f"].forEach(function(k){$("t"+k).onclick=function(){ask("t:"+k)}});
draw();if(W){W.onEvent("chatDataChanged",draw);W.onEvent("activated",function(){ask("r:s")});W.ready&&W.ready()}
</script></body></html>
